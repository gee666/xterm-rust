[package]
name = "xterm-wasm-support"
description = "DOM-free WASM value, option, error and subscription adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
xterm-core = { path = "../xterm-core" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.100"
js-sys = "=0.3.77"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.50"
# Test the actual canvas adapter without adding DOM to the support library.
web-sys = { version = "=0.3.77", features = ["Window", "Document", "Element", "HtmlElement", "Node", "HtmlCanvasElement", "CanvasRenderingContext2d", "OffscreenCanvas", "OffscreenCanvasRenderingContext2d", "TextMetrics"] }

[lints]
workspace = true
