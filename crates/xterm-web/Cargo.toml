[package]
name = "xterm-web"
description = "Rust browser and WASM integration for the xterm.js port"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# Read-only engine state snapshots for source differential/browser acceptance tests.
acceptance-hooks = ["dep:serde_json"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = { version = "1", optional = true }
xterm-core = { path = "../xterm-core" }
xterm-wasm-support = { path = "../xterm-wasm-support" }
ryu-js = "=1.0.3"
xterm-addons = { path = "../xterm-addons" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.100"
js-sys = "=0.3.77"
wasm-bindgen-futures = "=0.4.50"
web-sys = { version = "=0.3.77", features = [
  "Window", "Document", "DocumentFragment", "Node", "Element", "HtmlElement",
  "HtmlTextAreaElement", "DomTokenList", "EventTarget", "Event", "FocusEvent",
  "KeyboardEvent", "MouseEvent", "WheelEvent", "InputEvent", "CompositionEvent",
  "CssStyleDeclaration", "HtmlCanvasElement", "CanvasRenderingContext2d",
  "TextMetrics", "DomRect", "Performance", "Navigator", "Url",
  "FontFace", "FontFaceSet", "FontFaceLoadStatus", "FocusOptions",
  "CanvasGradient", "ImageData", "OffscreenCanvas", "OffscreenCanvasRenderingContext2d",
  "WebSocket", "BinaryType", "MessageEvent", "Clipboard", "ClipboardEvent", "DataTransfer",
  "IdleDeadline", "console", "AddEventListenerOptions", "HtmlCollection", "Location", "UiEvent", "HtmlIFrameElement", "PointerEvent", "PointerEventInit", "DomRectList", "IntersectionObserver", "IntersectionObserverEntry", "MediaQueryList", "MediaQueryListEvent",
  "WebGl2RenderingContext", "WebGlShader", "WebGlProgram", "WebGlBuffer", "WebGlTexture",
  "WebGlUniformLocation", "WebGlVertexArrayObject", "WebGlContextEvent",
  "ResizeObserver", "ResizeObserverEntry", "ResizeObserverSize", "DomRectReadOnly", "Path2d", "TouchEvent", "Touch", "TouchList", "CustomEvent", "CustomEventInit", "Selection", "Text", "NodeList"
] }

[dev-dependencies]
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.50"

[lints]
workspace = true
