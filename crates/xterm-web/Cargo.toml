[package]
name = "xterm-web"
description = "Rust browser and WASM integration for the xterm.js port"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
xterm-core = { path = "../xterm-core" }
xterm-addons = { path = "../xterm-addons" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.100"
js-sys = "=0.3.77"
wasm-bindgen-futures = "=0.4.50"
web-sys = { version = "=0.3.77", features = [
  "Window", "Document", "DocumentFragment", "Node", "Element", "HtmlElement",
  "HtmlTextAreaElement", "DomTokenList", "EventTarget", "Event", "FocusEvent",
  "KeyboardEvent", "MouseEvent", "WheelEvent", "InputEvent", "CompositionEvent",
  "CssStyleDeclaration", "HtmlCanvasElement", "CanvasRenderingContext2d",
  "TextMetrics", "DomRect", "Performance", "Navigator", "Url",
  "FontFace", "FontFaceSet", "FontFaceLoadStatus", "FocusOptions",
  "CanvasGradient", "ImageData", "OffscreenCanvas", "OffscreenCanvasRenderingContext2d",
  "WebSocket", "BinaryType", "MessageEvent", "Clipboard", "ClipboardEvent", "DataTransfer",
  "IdleDeadline", "console", "HtmlCollection", "Location", "UiEvent"
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.50"

[lints]
workspace = true
