[package]
name = "xterm-font-addons"
description = "Rust ligature shaping integration and browser web-font addons"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
xterm-addons = { path = "../xterm-addons" }
xterm-wasm-support = { path = "../xterm-wasm-support" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.100"
js-sys = "=0.3.77"
wasm-bindgen-futures = "=0.4.50"
web-sys = { version = "=0.3.77", features = ["Window", "Document", "FontFace", "FontFaceSet", "FontFaceLoadStatus", "console"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.50"

[lints]
workspace = true
